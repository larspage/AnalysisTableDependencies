<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Results - Database Dependency Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            color: #e2e8f0;
        }
        
        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 20px 40px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-left h1 {
            font-size: 1.5rem;
            color: #00d4ff;
        }
        
        .header-left p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 4px;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 0.9rem;
            border: none;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            color: #fff;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
        }
        
        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }
        
        .btn-secondary:hover {
            background: #475569;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
        }
        
        .stat-card h3 {
            color: #94a3b8;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #00d4ff;
        }
        
        .stat-card .detail {
            color: #64748b;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            background: #1e293b;
            padding: 4px;
            border-radius: 10px;
            width: fit-content;
        }
        
        .tab {
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #94a3b8;
            font-weight: 500;
            border: none;
            background: transparent;
        }
        
        .tab:hover {
            color: #e2e8f0;
        }
        
        .tab.active {
            background: #334155;
            color: #00d4ff;
        }
        
        .tab-content {
            display: none;
            background: #1e293b;
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #334155;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: #94a3b8;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #334155;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            border-radius: 8px;
            padding: 20px;
            color: #fca5a5;
            text-align: center;
        }
        
        /* Embedded report styles */
        #report-container {
            max-height: 70vh;
            overflow-y: auto;
        }
        
        #report-container ::-webkit-scrollbar {
            width: 8px;
        }
        
        #report-container ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        
        #report-container ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        
        .data-table th {
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        
        .data-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        
        .usage-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .usage-active {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        
        .usage-inactive {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .usage-partial {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
        }
        
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .header-actions {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .container {
                padding: 15px;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <h1>Analysis Results</h1>
            <p>Database Dependency Analysis Report</p>
        </div>
        <div class="header-actions">
            <a href="/" class="btn btn-secondary">← New Analysis</a>
            <a href="/session/{{ session_id }}/download" class="btn btn-primary">Download Report</a>
        </div>
    </header>
    
    <div class="container">
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <h3>Total Tables</h3>
                <div class="value" id="stat-tables">-</div>
            </div>
            <div class="stat-card">
                <h3>Total Objects</h3>
                <div class="value" id="stat-objects">-</div>
            </div>
            <div class="stat-card">
                <h3>Dependencies</h3>
                <div class="value" id="stat-dependencies">-</div>
            </div>
            <div class="stat-card">
                <h3>Unused Objects</h3>
                <div class="value" id="stat-unused">-</div>
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab active" data-tab="report">Full Report</button>
            <button class="tab" data-tab="usage">Usage Table</button>
            <button class="tab" data-tab="statistics">Statistics</button>
        </div>
        
        <div id="loading" class="tab-content active">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading analysis results...</p>
            </div>
        </div>
        
        <div id="error" class="tab-content">
            <div class="error">
                <p id="error-message">Failed to load analysis results.</p>
            </div>
        </div>
        
        <div id="report" class="tab-content">
            <div id="report-container"></div>
        </div>
        
        <div id="usage" class="tab-content">
            <div id="usage-container"></div>
        </div>
        
        <div id="statistics" class="tab-content">
            <div id="statistics-container"></div>
        </div>
    </div>
    
    <script>
        const sessionId = '{{ session_id }}';
        
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                this.classList.add('active');
                document.getElementById(this.dataset.tab).classList.add('active');
            });
        });
        
        // Load analysis data
        async function loadAnalysis() {
            try {
                const response = await fetch(`/session/${sessionId}/data`);
                
                if (!response.ok) {
                    throw new Error('Session not found or expired');
                }
                
                const data = await response.json();
                displayResults(data);
                
            } catch (error) {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('error').classList.add('active');
                document.getElementById('error-message').textContent = error.message;
            }
        }
        
        function displayResults(data) {
            document.getElementById('loading').classList.remove('active');
            
            // Update stats
            const stats = data.statistics;
            document.getElementById('stat-tables').textContent = stats.total_tables || 0;
            document.getElementById('stat-objects').textContent = stats.total_objects || 0;
            document.getElementById('stat-dependencies').textContent = 
                (stats.table_dependency_count || 0) + (stats.object_dependency_count || 0);
            document.getElementById('stat-unused').textContent = 
                data.usage_summary?.unused_object_count || 0;
            
            // Display full report
            document.getElementById('report-container').innerHTML = data.html_report;
            
            // Display usage table
            displayUsageTable(data.usage_summary);
            
            // Display statistics
            displayStatistics(stats);
        }
        
        function displayUsageTable(usage) {
            if (!usage || !usage.objects) {
                document.getElementById('usage-container').innerHTML = 
                    '<p style="color: #94a3b8;">No usage data available.</p>';
                return;
            }
            
            let html = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Object Name</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Dependencies</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            usage.objects.forEach(obj => {
                const statusClass = obj.is_used ? 'usage-active' : 'usage-inactive';
                const statusText = obj.is_used ? 'Active' : 'Unused';
                
                html += `
                    <tr>
                        <td>${obj.name || obj.object_name}</td>
                        <td>${obj.object_type || '-'}</td>
                        <td><span class="usage-badge ${statusClass}">${statusText}</span></td>
                        <td>${obj.dependency_count || 0}</td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            document.getElementById('usage-container').innerHTML = html;
        }
        
        function displayStatistics(stats) {
            if (!stats) {
                document.getElementById('statistics-container').innerHTML = 
                    '<p style="color: #94a3b8;">No statistics available.</p>';
                return;
            }
            
            let html = '<div style="display: grid; gap: 15px;">';
            
            for (const [key, value] of Object.entries(stats)) {
                const formattedKey = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                
                if (typeof value === 'object') {
                    html += `<div style="background: #0f172a; padding: 15px; border-radius: 8px;">
                        <h4 style="color: #94a3b8; margin-bottom: 10px;">${formattedKey}</h4>`;
                    
                    for (const [subKey, subValue] of Object.entries(value)) {
                        html += `<p><strong>${subKey.replace(/_/g, ' ')}:</strong> ${JSON.stringify(subValue)}</p>`;
                    }
                    
                    html += '</div>';
                } else {
                    html += `<div style="display: flex; justify-content: space-between; padding: 10px; background: #0f172a; border-radius: 8px;">
                        <span>${formattedKey}</span>
                        <span style="color: #00d4ff; font-weight: 600;">${JSON.stringify(value)}</span>
                    </div>`;
                }
            }
            
            html += '</div>';
            document.getElementById('statistics-container').innerHTML = html;
        }
        
        // Initialize
        loadAnalysis();
    </script>
</body>
</html>
