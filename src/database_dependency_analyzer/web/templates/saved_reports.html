<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Reports - Database Dependency Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        nav {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        nav .logo {
            font-size: 1.2rem;
            font-weight: 600;
            color: #00d4ff;
        }
        
        nav .nav-links {
            display: flex;
            gap: 20px;
        }
        
        nav .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        nav .nav-links a:hover,
        nav .nav-links a.active {
            color: #00d4ff;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #00d4ff;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 1rem;
        }
        
        .reports-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }
        
        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        .empty-state h3 {
            color: #94a3b8;
            margin-bottom: 10px;
        }
        
        .empty-state a {
            color: #00d4ff;
            text-decoration: none;
        }
        
        .empty-state a:hover {
            text-decoration: underline;
        }
        
        .reports-list {
            display: grid;
            gap: 15px;
        }
        
        .report-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .report-card:hover {
            border-color: rgba(0, 212, 255, 0.3);
            background: rgba(0, 212, 255, 0.05);
        }
        
        .report-info {
            flex: 1;
        }
        
        .report-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 5px;
        }
        
        .report-meta {
            display: flex;
            gap: 20px;
            color: #64748b;
            font-size: 0.85rem;
        }
        
        .report-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .report-stats {
            display: flex;
            gap: 15px;
            margin-right: 20px;
        }
        
        .stat {
            text-align: center;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }
        
        .stat-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: #00d4ff;
        }
        
        .stat-label {
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
        }
        
        .report-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 0.9rem;
            border: none;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            color: #fff;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
        }
        
        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }
        
        .btn-secondary:hover {
            background: #475569;
        }
        
        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            border-radius: 8px;
            padding: 15px;
            color: #fca5a5;
            text-align: center;
        }
        
        /* Confirmation Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: #1e293b;
            border-radius: 12px;
            padding: 30px;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .modal-content h3 {
            margin-bottom: 15px;
            color: #e2e8f0;
        }
        
        .modal-content p {
            color: #94a3b8;
            margin-bottom: 25px;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        @media (max-width: 768px) {
            .report-card {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
            
            .report-stats {
                margin-right: 0;
            }
            
            .report-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">📊 DB Dependency Analyzer</div>
        <div class="nav-links">
            <a href="/">New Analysis</a>
            <a href="/saved-reports" class="active">Saved Reports</a>
        </div>
    </nav>
    
    <div class="container">
        <header>
            <h1>📁 Saved Reports</h1>
            <p class="subtitle">View and manage your saved analysis reports</p>
        </header>
        
        <section class="reports-section">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading saved reports...</p>
            </div>
            
            <div class="error-message" id="error-message" style="display: none;"></div>
            
            <div id="reports-container"></div>
        </section>
    </div>
    
    <!-- Delete Confirmation Modal -->
    <div class="modal" id="delete-modal">
        <div class="modal-content">
            <h3>Delete Report?</h3>
            <p>Are you sure you want to delete "<span id="delete-report-name"></span>"? This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" id="confirm-delete-btn">Delete</button>
            </div>
        </div>
    </div>
    
    <script>
        let reportToDelete = null;
        
        async function loadReports() {
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('error-message');
            const container = document.getElementById('reports-container');
            
            try {
                const response = await fetch('/api/saved-reports');
                const data = await response.json();
                
                loading.style.display = 'none';
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load reports');
                }
                
                if (data.reports.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <h3>No Saved Reports</h3>
                            <p>You haven't saved any reports yet.<br>
                            <a href="/">Run an analysis</a> and save the results to see them here.</p>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = '<div class="reports-list">' + 
                    data.reports.map(report => createReportCard(report)).join('') +
                    '</div>';
                
            } catch (error) {
                loading.style.display = 'none';
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
            }
        }
        
        function createReportCard(report) {
            const date = report.created_at ? new Date(report.created_at).toLocaleString() : 'Unknown date';
            const stats = report.statistics || {};
            
            return `
                <div class="report-card" data-id="${report.id}">
                    <div class="report-info">
                        <div class="report-name">${escapeHtml(report.name)}</div>
                        <div class="report-meta">
                            <span>📅 ${date}</span>
                            <span>📁 ${report.source === 'sample_files' ? 'Sample Files' : 'Uploaded Files'}</span>
                        </div>
                    </div>
                    <div class="report-stats">
                        <div class="stat">
                            <div class="stat-value">${stats.total_tables || 0}</div>
                            <div class="stat-label">Tables</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${stats.total_objects || 0}</div>
                            <div class="stat-label">Objects</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${stats.unused_tables || 0}</div>
                            <div class="stat-label">Unused</div>
                        </div>
                    </div>
                    <div class="report-actions">
                        <a href="/saved-reports/${report.id}" class="btn btn-primary">View</a>
                        <a href="/saved-reports/${report.id}/download" class="btn btn-secondary">Download</a>
                        <button class="btn btn-danger" onclick="confirmDelete('${report.id}', '${escapeHtml(report.name)}')">Delete</button>
                    </div>
                </div>
            `;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function confirmDelete(reportId, reportName) {
            reportToDelete = reportId;
            document.getElementById('delete-report-name').textContent = reportName;
            document.getElementById('delete-modal').classList.add('active');
        }
        
        function closeDeleteModal() {
            reportToDelete = null;
            document.getElementById('delete-modal').classList.remove('active');
        }
        
        document.getElementById('confirm-delete-btn').addEventListener('click', async function() {
            if (!reportToDelete) return;
            
            try {
                const response = await fetch(`/saved-reports/${reportToDelete}/delete`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to delete report');
                }
                
                closeDeleteModal();
                loadReports(); // Reload the list
                
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
        
        // Close modal when clicking outside
        document.getElementById('delete-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeDeleteModal();
            }
        });
        
        // Load reports on page load
        loadReports();
    </script>
</body>
</html>
